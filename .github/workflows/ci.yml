name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: flake8 .
      - name: Test
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t attendance:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name api -p 8000:8000 attendance:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs -X POST http://localhost:8000/students -H 'Content-Type: application/json' \
            -d '{"roll_no":"CS001","name":"Asha","class_name":"CSE-A"}' | grep -q CS001
          curl -fs -X POST http://localhost:8000/sessions -H 'Content-Type: application/json' \
            -d '{"class_name":"CSE-A"}' | grep -q '"id"'
          curl -fs http://localhost:8000/sessions/1/report | grep -q '"absent":1'
      - name: Logs on failure
        if: failure()
        run: docker logs api
